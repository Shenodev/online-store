# Shenostore backend — Aiven MySQL wiring.
# NEVER commit real credentials. Copy to real env / secret manager:
#   MYSQL_URL, MYSQL_USER, MYSQL_PASSWORD, JWT_SECRET.
#
# Aiven connection string shape:
#   jdbc:mysql://<host>:<port>/<db>?ssl-mode=REQUIRED&serverTimezone=UTC
# Aiven requires TLS; `ssl-mode=REQUIRED` enforces it. Connection pooling is
# HikariCP, sized small (serverless-friendly: max 5) so cold starts cannot
# exhaust the Aiven connection budget.

spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/shenostore?ssl-mode=REQUIRED&serverTimezone=UTC&useUnicode=true&characterEncoding=utf8mb4}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP — conservative for Vercel/serverless + Aiven caps.
spring.datasource.hikari.pool-name=ShenostoreHikari
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA — entities are strict; DDL is owned by Flyway V1 migration.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway — versioned multi-tenant schema, validated on boot.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false

# JWT (stateless; store_id travels in claims)
app.jwt.secret=${JWT_SECRET:change-me-to-a-256-bit-secret}
app.jwt.expiration-ms=86400000

# CORS (comma-separated; custom domains appended at runtime)
app.cors.allowed-origins=${CORS_ORIGINS:https://store.shenodev.tech,https://admin.store.shenodev.tech}

server.port=${PORT:8080}
