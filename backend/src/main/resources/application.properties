# Aiven MySQL — configure via environment, never commit credentials.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/shenostore?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:changeme}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=${JWT_SECRET:change-me-to-a-256-bit-secret}
app.jwt.expiration-ms=86400000

# CORS (comma-separated; custom domains appended at runtime)
app.cors.allowed-origins=${CORS_ORIGINS:https://store.shenodev.tech,https://admin.store.shenodev.tech}

server.port=${PORT:8080}
